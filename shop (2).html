<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Mart - Online Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;}
body{background:#f4f4f4;}
header{
  background:linear-gradient(135deg,#16a34a,#15803d);
  color:white;
  text-align:center;
  padding:20px;
}
header h1{margin-bottom:5px;}
nav{
  background:#111;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:15px;
  padding:10px;
  position:sticky;
  top:0;
  z-index:100;
}
nav a{
  color:white;
  text-decoration:none;
  font-weight:bold;
  cursor:pointer;
}
nav a:hover{color:#4ade80;}
.container{padding:20px;max-width:1100px;margin:0 auto;}
.top-bar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
input{
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
  flex:1;
}
select{
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}
button{
  padding:10px 15px;
  border:none;
  background:#111;
  color:white;
  border-radius:8px;
  cursor:pointer;
}
button:hover{background:#333;}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}
.card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  display:flex;
  flex-direction:column;
}
.card img{
  width:100%;
  height:160px;
  object-fit:cover;
  background:#eee;
}
.card-body{padding:10px;flex:1;display:flex;flex-direction:column;}
.card-body h3{font-size:16px;margin-bottom:5px;}
.card-body p.desc{font-size:13px;color:#666;margin-bottom:8px;flex:1;}
.price{color:green;font-weight:bold;margin-bottom:8px;}
.card-body button{width:100%;}
.section-title{
  font-size:22px;
  margin:30px 0 15px 0;
  border-left:5px solid #16a34a;
  padding-left:10px;
}
.cart{
  background:white;
  padding:15px;
  margin-top:20px;
  border-radius:10px;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #eee;
}
.cart-item:last-child{border-bottom:none;}
.qty-controls{display:flex;align-items:center;gap:8px;}
.qty-controls button{padding:4px 10px;}
.remove{
  background:red;
  padding:5px 10px;
  border:none;
  color:white;
  border-radius:6px;
  cursor:pointer;
}
.remove:hover{background:#c00;}
.cart-total{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:18px;
  margin-top:10px;
  padding-top:10px;
  border-top:2px solid #111;
}
.contact{
  background:white;
  padding:15px;
  margin-top:20px;
  border-radius:10px;
}
.contact input, .contact textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}
.contact textarea{resize:vertical;min-height:80px;}
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:50px;
  text-decoration:none;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  z-index:200;
}
.checkout-box{
  background:white;
  padding:15px;
  margin-top:20px;
  border-radius:10px;
}
.checkout-box input{
  width:100%;
  margin-bottom:10px;
}
.empty-msg{color:#999;text-align:center;padding:20px;}
footer{
  text-align:center;
  padding:20px;
  color:#777;
  font-size:13px;
}
.badge{
  background:#16a34a;
  color:white;
  border-radius:20px;
  padding:2px 8px;
  font-size:12px;
  margin-left:5px;
}
.cat-card{
  cursor:pointer;
  text-align:center;
  transition:transform .15s;
}
.cat-card:hover{transform:translateY(-4px);}
.cat-card img{height:120px;}
.cat-card .card-body{
  text-align:center;
  padding:10px;
}
.cat-card.active{
  outline:3px solid #16a34a;
}
@media(max-width:500px){
  .top-bar{flex-direction:column;}
}
</style>
</head>
<body>

<header>
  <h1>🥬 Fresh Mart</h1>
  <p>Fresh groceries delivered to your door</p>
</header>

<nav>
  <a onclick="scrollToSection('products')">Products</a>
  <a onclick="scrollToSection('cart')">Cart <span id="navCartCount" class="badge">0</span></a>
  <a onclick="scrollToSection('checkout')">Checkout</a>
  <a onclick="scrollToSection('contact')">Contact</a>
</nav>

<div class="container">

  <div class="top-bar">
    <input type="text" id="searchInput" placeholder="Search products..." oninput="renderProducts()">
    <select id="categorySelect" onchange="onCategoryChange()">
      <option value="all">All Categories</option>
      <option value="fruit">Fruits</option>
      <option value="vegetable">Vegetables</option>
      <option value="dairy">Dairy</option>
      <option value="bakery">Bakery</option>
      <option value="meat">Meat & Poultry</option>
      <option value="seafood">Seafood</option>
      <option value="beverages">Beverages</option>
      <option value="snacks">Snacks</option>
      <option value="pantry">Pantry & Grains</option>
      <option value="frozen">Frozen</option>
      <option value="household">Household</option>
    </select>
  </div>

  <h2 class="section-title" id="categories">Shop by Category</h2>
  <div class="grid" id="categoryGrid"></div>

  <h2 class="section-title" id="products">Products</h2>
  <div class="grid" id="productGrid"></div>

  <h2 class="section-title" id="cart">Your Cart</h2>
  <div class="cart">
    <div id="cartItems"></div>
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">QR 0.00</span>
    </div>
  </div>

  <h2 class="section-title" id="checkout">Checkout</h2>
  <div class="checkout-box">
    <input type="text" id="custName" placeholder="Full Name">
    <input type="text" id="custPhone" placeholder="Phone Number">
    <input type="text" id="custAddress" placeholder="Delivery Address">
    <button onclick="placeOrder()">Place Order</button>
  </div>

  <h2 class="section-title" id="contact">Contact Us</h2>
  <div class="contact">
    <input type="text" id="contactName" placeholder="Your Name">
    <input type="email" id="contactEmail" placeholder="Your Email">
    <textarea id="contactMsg" placeholder="Your Message"></textarea>
    <button onclick="sendContact()">Send Message</button>
  </div>

</div>

<a class="whatsapp" href="https://wa.me/10000000000" target="_blank">💬 WhatsApp</a>

<footer>© 2026 Fresh Mart. All rights reserved.</footer>

let cart = {}; // {id: qty}

// ---------- Category Data (photo matches category name) ----------
const categories = [
  {id:"fruit", name:"Fruits", img:"https://images.unsplash.com/photo-1610832958506-aa56368176cf?w=400"},
  {id:"vegetable", name:"Vegetables", img:"https://images.unsplash.com/photo-1540420773420-3366772f4999?w=400"},
  {id:"dairy", name:"Dairy", img:"https://images.unsplash.com/photo-1628088062854-d1870b4553da?w=400"},
  {id:"bakery", name:"Bakery", img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400"},
  {id:"meat", name:"Meat & Poultry", img:"https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=400"},
  {id:"seafood", name:"Seafood", img:"https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=400"},
  {id:"beverages", name:"Beverages", img:"https://images.unsplash.com/photo-1544145945-f90425340c7e?w=400"},

  {id:"frozen", name:"Frozen", img:"https://images.unsplash.com/photo-1580910051074-3eb694886505?w=400"},
  {id:"household", name:"Household", img:"https://images.unsplash.com/photo-1583947215259-38e31be8751f?w=400"}
];

// ---------- Render Categories ----------
function renderCategories(){
  const grid = document.getElementById('categoryGrid');
  const activeCat = document.getElementById('categorySelect').value;
  grid.innerHTML = '';

  categories.forEach(c=>{
    const card = document.createElement('div');
    card.className = 'card cat-card' + (activeCat === c.id ? ' active' : '');
    card.onclick = () => selectCategory(c.id);
    card.innerHTML = `
      <img src="${c.img}" alt="${c.name}">
      <div class="card-body"><h3>${c.name}</h3></div>
    `;
    grid.appendChild(card);
  });
}

function selectCategory(id){
  document.getElementById('categorySelect').value = id;
  onCategoryChange();
}

function onCategoryChange(){
  renderCategories();
  renderProducts();
}

// ---------- Render Products ----------
function renderProducts(){
  const grid = document.getElementById('productGrid');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const category = document.getElementById('categorySelect').value;

  const filtered = products.filter(p=>{
    const matchesSearch = p.name.toLowerCase().includes(search);
    const matchesCategory = category === 'all' || p.category === category;
    return matchesSearch && matchesCategory;
  });

  grid.innerHTML = '';
  if(filtered.length === 0){
    grid.innerHTML = '<p class="empty-msg">No products found.</p>';
    return;
  }

  filtered.forEach(p=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${p.img}" alt="${p.name}">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <div class="price">QR ${p.price.toFixed(2)}</div>
        <button onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

// ---------- Cart Functions ----------
function addToCart(id){
  cart[id] = (cart[id] || 0) + 1;
  renderCart();
}

function changeQty(id, delta){
  if(!cart[id]) return;
  cart[id] += delta;
  if(cart[id] <= 0) delete cart[id];
  renderCart();
}

function removeFromCart(id){
  delete cart[id];
  renderCart();
}

function renderCart(){
  const cartItemsDiv = document.getElementById('cartItems');
  const ids = Object.keys(cart);
  let total = 0;

  if(ids.length === 0){
    cartItemsDiv.innerHTML = '<p class="empty-msg">Your cart is empty.</p>';
  } else {
    cartItemsDiv.innerHTML = '';
    ids.forEach(id=>{
      const product = products.find(p=>p.id == id);
      const qty = cart[id];
      const subtotal = product.price * qty;
      total += subtotal;

      const item = document.createElement('div');
      item.className = 'cart-item';
      item.innerHTML = `
        <span>${product.name}</span>
        <div class="qty-controls">
          <button onclick="changeQty(${id}, -1)">-</button>
          <span>${qty}</span>
          <button onclick="changeQty(${id}, 1)">+</button>
        </div>
        <span>QR ${subtotal.toFixed(2)}</span>
        <button class="remove" onclick="removeFromCart(${id})">Remove</button>
      `;
      cartItemsDiv.appendChild(item);
    });
  }

  document.getElementById('cartTotal').textContent = `QR ${total.toFixed(2)}`;
  document.getElementById('navCartCount').textContent = ids.reduce((sum,id)=>sum+cart[id],0);
}

// ---------- Checkout ----------
function placeOrder(){
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  const ids = Object.keys(cart);

  if(ids.length === 0){
    alert('Your cart is empty. Please add products before checking out.');
    return;
  }
  if(!name || !phone || !address){
    alert('Please fill in your name, phone, and address to place the order.');
    return;
  }

  alert(`Thank you, ${name}! Your order has been placed and will be delivered to:\n${address}\nWe will contact you at ${phone}.`);

  cart = {};
  renderCart();
  document.getElementById('custName').value = '';
  document.getElementById('custPhone').value = '';
  document.getElementById('custAddress').value = '';
}

// ---------- Contact Form ----------
function sendContact(){
  const name = document.getElementById('contactName').value.trim();
  const email = document.getElementById('contactEmail').value.trim();
  const msg = document.getElementById('contactMsg').value.trim();

  if(!name || !email || !msg){
    alert('Please fill in all fields before sending your message.');
    return;
  }

  alert(`Thanks ${name}, your message has been sent! We'll get back to you at ${email}.`);
  document.getElementById('contactName').value = '';
  document.getElementById('contactEmail').value = '';
  document.getElementById('contactMsg').value = '';
}

// ---------- Nav Scroll ----------
function scrollToSection(id){
  document.getElementById(id).scrollIntoView({behavior:'smooth'});
}

// ---------- Init ----------
renderCategories();
renderProducts();
renderCart();
</script>

</html>
